name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://machine_intelligence:machine_intelligence_ci@localhost:5432/machine_intelligence
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: machine_intelligence
          POSTGRES_USER: machine_intelligence
          POSTGRES_PASSWORD: machine_intelligence_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U machine_intelligence -d machine_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install ".[dev]"
      - name: Migrate PostgreSQL
        run: alembic upgrade head
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check app tests migrations scripts

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
